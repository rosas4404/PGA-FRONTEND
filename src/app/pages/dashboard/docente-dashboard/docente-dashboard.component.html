<div class="d-flex" style="height: calc(100vh - 120px);">
  <div class="sidebar bg-arena text-maroon p-3" [class.collapsed]="isCollapsed">

      <div class="d-flex align-items-center">
        <button class="btn btn-sm btn-toggle fs-4 ms-2" (click)="toggleSidebar()">
          <i class="bi bi-list" > </i>
        </button>
      </div>

      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-person-workspace text-maroon fs-4 ms-3"></i>
        <h6 class="fw-bold text-maroon m-0" *ngIf="!isCollapsed">{{usuario?.nombre}} {{usuario?.apellidoPaterno}}</h6>
      </div>


    <ul class="nav nav-pills flex-column gap-2 flex-grow-1">

      <li class="nav-item mt-2" 
      [attr.title]="isCollapsed ? 'General' : null">
        <a class="nav-link text-maroon sidebar-link"
           routerLink="inicio"
           routerLinkActive="active">
           <i class="bi bi-house-fill fs-4 "></i>
             <span *ngIf="!isCollapsed" class="ms-2">General</span>
        </a>
      </li>

      <li class="nav-item" [attr.title]="isCollapsed ? 'Sesiones' : null">
        <a class="nav-link text-maroon sidebar-link"
           routerLink="sesiones"
           routerLinkActive="active">
           <i class="bi bi-people-fill fs-4 "></i>
             <span *ngIf="!isCollapsed" class="ms-2">Sesión</span>
        </a>
      </li>

      <li class="nav-item mt-auto" [attr.title]="isCollapsed ? 'Perfil' : null">
        <a class="nav-link text-maroon sidebar-link"
           routerLink="perfil"
           routerLinkActive="active">
           <i class="bi bi-person-fill fs-4"></i>
             <span *ngIf="!isCollapsed" class="ms-2">Perfil</span>
        </a>
      </li>

    </ul>

  </div>

  <!-- CONTENIDO -->
  <div class="flex-grow-1 p-4 bg-light overflow-auto">
    <router-outlet></router-outlet>
  </div>

</div>
