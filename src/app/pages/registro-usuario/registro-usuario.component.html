<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow">
        <div class="card-header bg-maroon text-white text-center">
          <h4>Registro</h4>
        </div>

        <div class="card-body">
          <form [formGroup]="registroForm" (ngSubmit)="submit()" autocomplete="off">
            <!------------ DATOS DEL USUARIO ------------------>
            <!-- Nombre -->
            <div class="col-md-12 mt-1">
              <label class="form-label" style="font-size:0.9rem;"> Nombre </label>
              <input type="text" class="form-control"
                formControlName="nombre"
                [ngClass]="{
                'is-invalid': registroForm.get('nombre')?.invalid && registroForm.get('nombre')?.touched
              }">
              <div class="invalid-feedback" style="font-size:0.6rem;">
                Campo obligatorio.
              </div>
            </div>
            <!-- Apellido Paterno -->
             <div class="row">
            <div class="col-md-6">
              <label class="form-label"style="font-size:0.9rem;">Apellido Paterno</label>
              <input type="text" class="form-control"
                formControlName="apellidoPaterno"
                [ngClass]="{'is-invalid': registroForm.get('apellidoPaterno')?.invalid && registroForm.get('apellidoPaterno')?.touched}">
              <div class="invalid-feedback" style="font-size:0.6rem;">
                Campo obligatorio.
              </div>
            </div>
            <!-- Apellido Materno -->
            <div class="col-md-6">
              <label class="form-label"style="font-size:0.9rem;">Apellido Materno</label>
              <input type="text" class="form-control"
              formControlName="apellidoMaterno"
              [ngClass]="{'is-invalid': registroForm.get('apellidoMaterno')?.invalid && registroForm.get('apellidoMaterno')?.touched}">
              <div class="invalid-feedback" style="font-size:0.6rem;">
                Campo obligatorio.
              </div>
            </div>
            </div>
            <div class="row mt-1">
            <!-- Email -->
            <div class="col-md-8">
              <label class="form-label"style="font-size:0.9rem;">Email</label>
              <input type="email" class="form-control" formControlName="email" placeholder="usuario@example.com" 
                [ngClass]="{'is-invalid': registroForm.get('email')?.invalid && registroForm.get('email')?.touched}">
              <div class="invalid-feedback" style="font-size:0.6rem;">
                    <div *ngIf="registroForm.get('email')?.errors?.['required']">
                        Campo obligatorio.
                    </div>
                    <div *ngIf="registroForm.get('email')?.errors?.['email'] || registroForm.get('email')?.errors?.['pattern']">
                        Por favor, ingrese un formato de correo válido
                    </div>
              </div>
            </div>
            <!-- Teléfono -->
            <div class="col-md-4">
              <label class="form-label"style="font-size:0.9rem;">Teléfono</label>
              <input type="text" class="form-control"
                maxlength="10"
                formControlName="telefono"
                [ngClass]="{'is-invalid': registroForm.get('telefono')?.invalid && registroForm.get('telefono')?.touched}">

              <div class="invalid-feedback" style="font-size:0.6rem;">
                <div *ngIf="registroForm.get('telefono')?.errors?.['required']">
                        Campo obligatorio.
                </div>
                <div *ngIf="registroForm.get('telefono')?.errors?.['minlength']|| registroForm.get('telefono')?.errors?.['maxlength']">
                        Deben ser exactamente 10 dígitos.
                </div>
                <div *ngIf="registroForm.get('telefono')?.errors?.['pattern']">
                        Sólo se permiten números.
                </div>
              </div>
            </div>

            <!-- Direccion -->
            <div class="col-md-12 mt-1">
              <label class="form-label"style="font-size:0.9rem;">Dirección</label>
              <input type="text" class="form-control"
                formControlName="direccion"
                [ngClass]="{'is-invalid': registroForm.get('direccion')?.invalid && registroForm.get('direccion')?.touched}">

              <div class="invalid-feedback" style="font-size:0.6rem;">
                Campo obligatorio.
              </div>
            </div>
          </div>
          <!--------------------------- Tipo de registro -------------------->
          <div class="row align-items-center mt-3">

            <!-- Título -->
            <div class="col-md-4">
              <label class="form-label mb-0 fw-bold " style="font-size:0.9rem;">
                Tipo de Registro
              </label>
            </div>

            <!-- Botones -->
            <div class="col-md-8">
              <div class="btn-group w-100" role="group">
                <button
                  type="button"
                  class="btn"
                  style="font-size:0.9rem;"
                  [class.bg-maroon]="registroForm.get('rol')?.value === 'ALUMNO'"
                  [class.btn-outline-primary]="registroForm.get('rol')?.value !== 'ALUMNO'"
                  (click)="registroForm.get('rol')?.setValue('ALUMNO')">
                  Alumno
                </button>

                <button
                  type="button"
                  class="btn"
                  style="font-size:0.9rem;"
                  [class.bg-maroon]="registroForm.get('rol')?.value === 'DOCENTE'"
                  [class.btn-outline-primary]="registroForm.get('rol')?.value !== 'DOCENTE'"
                  (click)="registroForm.get('rol')?.setValue('DOCENTE')">
                  Docente
                </button>
              </div>
            </div>

          </div>

          <!-- Mensaje de error -->
          <div class="text-danger small"
              *ngIf="registroForm.get('tipo')?.invalid && registroForm.get('rol')?.touched">
            Seleccione un tipo
          </div>

        <div class="text-center mt-3">
          <button class="btn btn-sm bg-maroon px-4" style="font-size:0.9rem;" type="submit" [disabled]="registroForm.invalid">
            Crear Usuario
          </button>
        </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
