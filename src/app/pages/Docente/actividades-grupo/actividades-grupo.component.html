    <div class="accordion">
        <div class="accordion-item" *ngFor = "let campo of gruposCamposFiltrados; let i = index">
            <h2 class="accordion-header">
                <button class="accordion-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        [attr.data-bs-target]="'#panel' + i">
                          {{ campo.nombre == 'Sin campo' ?  'General': campo.nombre   }}

                </button>
            </h2>
        
            <div [id]="'panel' + i" class="accordion-collapse collapse">
                <div class="accordion-body">
                    <div *ngFor="let act of campo.actividades">
                        <div class="card mb-2 p-2">
                            <strong>{{ act.titulo }}</strong>
                            <p class="mb-0 text-muted">{{ act.descripcion }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
