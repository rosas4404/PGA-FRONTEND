<div class="card shadow-sm border-0">
    <!-- cabecera -->
    <div class="card-header bg-smoke d-flex justify-content-between align-items-center mb-3">
      <h5 class="m-0 fw-bold text-maroon">Gestión de Sesiones</h5>
    </div>

  <div class="card-body">
  <!--Fitlro dinamico-->
    <form [formGroup]="filtroFormulario" (ngSubmit)="buscar()">
      <div class="row g-3 mb-4 ">
        
        <!-- filtro por fecha -->
        <div class="col-md-4 me-5">
          <select class="form-select" formControlName="momentoSesion">
            <option [ngValue]="null">Cualquier momento</option>
            <option [ngValue]="'POR_INICIAR'">Próximas sesiones</option>
            <option [ngValue]="'FINALIZADAS'">Sesiones pasadas</option>
          </select>
        </div>

        <!-- filtro por alcance -->
        <div class="col-md-2 me-5 ms-5">
          <select class="form-select" formControlName="alcance">
            <option [ngValue]="null">Todos los alcances</option>
            <option [ngValue]="'GRUPAL'">Grupal</option>
            <option [ngValue]="'INDIVIDUAL'">Individual</option>
          </select>
        </div>

        <!-- Botón -->
        <div class="col-md-2 ms-5">
          <button type="submit" class="btn btn-outline-primary w-100">
            Buscar
          </button>
        </div>
          <div class="col-md-2">
          <button type="button"
            class="btn btn-outline-primary w-100"
            (click)="limpiarFiltros()">
            Limpiar
          </button>
        </div>
      </div>
    </form>
  
    <!-- TABLA -->
      <div class="table-responsive">
        <table class="table table-hover table-striped w-100">

          <thead class="table-light text-center text-maroon">
            <tr>
              <th>Fecha</th>
              <th>Tema</th>
              <th>Alcance</th>
              <th>URL:</th>
              <th>Estado:</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let s of sesionAlumno; let i = index">
              <td class = "text-center">{{ s.fecha }}</td>
              <td class = "text-center">{{ s.tema }}</td>
              <td class = "text-center">{{ s.alcance }}</td>
              <td class = "text-center"><a [href]="s.url" target="_blank">{{ s.url }}</a></td>
              <td class = "text-center">{{ $any(s?.estadoAsistencia)?.replace('_', ' ')}}</td>
            </tr>

            <tr *ngIf="sesionAlumno.length === 0">
              <td colspan="6" class="text-center text-muted py-4">
                No existen clases programadas próximamente.
              </td>
            </tr>

          </tbody>
        </table>

        <!-- Componente del paginador -->
      <nav *ngIf="totalPages > 0" class="mt-4">
        <ul class="pagination justify-content-center">

          <li class="page-item" [class.disabled]="page === 0">
            <button class="page-link"
                    (click)="cambiarPagina(page - 1)"
                    [disabled]="page === 0">
              «
            </button>
          </li>

          <li class="page-item"
              *ngFor="let p of paginas"
              [class.active]="p === page">
            <button class="page-link"
                    (click)="cambiarPagina(p)">
              {{ p + 1 }}
            </button>
          </li>

          <li class="page-item"
              [class.disabled]="page + 1 >= totalPages" >
            <button class="page-link"
                    (click)="cambiarPagina(page + 1)"
                    [disabled]="page + 1 >= totalPages">
              »
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </div>
